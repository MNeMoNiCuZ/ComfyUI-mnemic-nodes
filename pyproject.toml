[project]
name = "comfyui-mnemic-nodes"
description = "Added support for step control in LoRA loader, you can now choose which start/end step to have a LoRA enabled for. Made the tooltip for wildcard processing optional (default off), as it was too huge. The guide is now available in the ?-button instead."
version = "3.1.5"
license = { file = "LICENSE" }
dependencies = ["configparser", "groq", "transformers", "torch", "tiktoken", "imageio", "tqdm", "piexif", "requests", "colorama", "opencv-python", "python-dotenv"]

[project.urls]
Repository = "https://github.com/MNeMoNiCuZ/ComfyUI-mnemic-nodes"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "mnemic"
